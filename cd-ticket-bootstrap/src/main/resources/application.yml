server:
  port: 8600

spring:
  application:
    name: cd-ticket
  datasource:
    url: jdbc:mysql://localhost:3306/cd_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: cdwatermysql
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: cdwaterredis

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:cd-ticket-dev-secret-key-0123456789abcdef0123456789abcdef}
  access-expire-seconds: 900
  refresh-expire-seconds: 604800

sms:
  sender: mock
  code-expire-seconds: 300
  send-cooldown-seconds: 60
