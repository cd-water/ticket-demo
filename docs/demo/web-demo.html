<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CD-TICKET 电影票务系统 · 选座购票演示</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;800&family=DIN+Alternate:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9ED;          /* 米白底 */
  --bg-deep:#FFF3D6;     /* 深一档米黄 */
  --card:#FFFFFF;
  --brand:#FFC300;       /* 美团黄主色调 */
  --brand-deep:#F5A623;   /* 黄橙 */
  --ink:#2B2B2B;         /* 主文字 */
  --ink-2:#6B6455;       /* 次要 */
  --line:#F0E4C8;        /* 分隔线 */
  --ok:#2FA84F;          /* 成功绿 */
  --danger:#E5484D;      /* 售罄/错误红 */
  --radius:16px;
  --shadow:0 6px 24px rgba(0,0,0,.06);
  --sans:'Noto Sans SC',system-ui,sans-serif;
  --serif:'Noto Serif SC',serif;
  --din:'DIN Alternate',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.page{display:none;max-width:1200px;margin:0 auto;padding:0 24px 80px}
.page.active{display:block}
.page h2.sec{font-family:var(--serif);font-size:22px;font-weight:800;margin:36px 0 16px;display:flex;align-items:center;gap:10px}
.page h2.sec .all{margin-left:auto;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-2)}
.page h2.sec .all:hover{color:var(--brand-deep)}

/* ---- 顶栏 ---- */
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:800;font-size:20px}
.logo .dot{width:12px;height:12px;border-radius:3px;background:var(--brand);box-shadow:0 0 0 4px rgba(255,195,0,.25)}
.nav{display:flex;gap:22px}
.nav a{font-size:15px;color:var(--ink-2);padding:4px 0}
.nav a.on{color:var(--ink);font-weight:700;border-bottom:2px solid var(--brand)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.userchip{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#7a5200}
.btn{padding:9px 20px;border-radius:999px;font-size:14px;font-weight:700}
.btn-primary{background:var(--brand);color:#5c3d00}
.btn-primary:hover{background:var(--brand-deep);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn-block{display:block;width:100%;text-align:center}

/* ---- 放映机光束签名 ---- */
.beam-wrap{position:relative;overflow:hidden;border-radius:var(--radius)}
.beam{position:absolute;top:-20%;right:-6%;width:46%;height:150%;background:linear-gradient(115deg,rgba(255,195,0,0) 0%,rgba(255,195,0,.28) 60%,rgba(255,195,0,.55) 100%);clip-path:polygon(60% 0,100% 0,35% 100%,0 100%);mix-blend-mode:soft-light;pointer-events:none;animation:beamDrift 6s ease-in-out infinite alternate}
@keyframes beamDrift{from{transform:translateX(0)}to{transform:translateX(-6%)}}

/* ---- 首页 ---- */
.hero{position:relative;border-radius:var(--radius);background:linear-gradient(120deg,#FFF3D6,#FFE9B8);padding:56px 48px;margin-top:24px;overflow:hidden}
.hero h1{font-family:var(--serif);font-size:40px;font-weight:800;line-height:1.2;position:relative;z-index:2}
.hero p{margin-top:12px;font-size:16px;color:var(--ink-2);position:relative;z-index:2;max-width:460px}
.hero .cta{margin-top:24px;padding:12px 32px;border-radius:999px;background:var(--brand);color:#5c3d00;font-size:16px;font-weight:700;position:relative;z-index:2}
.hero .cta:hover{background:var(--brand-deep);color:#fff}
.hero .ticket{position:absolute;right:64px;bottom:44px;width:140px;height:200px;background:#fff;border-radius:10px;box-shadow:var(--shadow);transform:rotate(8deg);z-index:1}
.hero .ticket:before,.hero .ticket:after{content:"";position:absolute;left:-14px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.hero .ticket:before{top:-14px}.hero .ticket:after{bottom:-14px}
.hero .ticket .cut{position:absolute;left:20px;right:20px;top:50%;border-top:1px dashed var(--line)}
.hero .ticket .movie{position:absolute;left:12px;right:12px;top:16px;text-align:center;font-family:var(--serif);font-weight:800}
.hero .ticket .price{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-family:var(--din);font-size:24px;color:var(--brand-deep)}

/* ---- 海报卡片 ---- */
.poster-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.poster{cursor:pointer}
.poster .img{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#F3E7C8,#EAD9A8);box-shadow:var(--shadow);transition:transform .2s}
.poster .img:hover{transform:translateY(-4px)}
.poster .img .tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff}
.poster .img .tag.coming{background:var(--ink-2)}
.poster .t{font-family:var(--serif);font-weight:700;font-size:15px;margin-top:10px}
.poster .d{font-size:12px;color:var(--ink-2);margin-top:2px}
.poster .p{font-family:var(--din);font-size:14px;color:var(--brand-deep);font-weight:700;margin-top:4px}
.poster .p small{font-size:11px;color:var(--ink-2);font-family:var(--sans);font-weight:400}

/* ---- 电影详情 ---- */
.movie-hero{display:grid;grid-template-columns:280px 1fr;gap:40px;margin-top:28px;align-items:start}
.movie-poster{aspect-ratio:2/3;border-radius:var(--radius);background:linear-gradient(160deg,#F3E7C8,#EAD9A8);box-shadow:var(--shadow)}
.movie-info h1{font-family:var(--serif);font-size:30px;font-weight:800}
.movie-meta{margin-top:12px;font-size:14px;color:var(--ink-2);line-height:1.9}
.movie-desc{margin-top:18px;font-size:14px;line-height:1.9;color:var(--ink)}
.movie-buy{margin-top:26px;padding:14px 46px;font-size:17px;border-radius:999px;background:var(--brand);color:#5c3d00;font-weight:800}
.movie-buy:hover{background:var(--brand-deep);color:#fff}
.movie-price{margin-top:14px;font-family:var(--din);font-size:22px;color:var(--brand-deep);font-weight:700}
.movie-price small{font-size:13px;color:var(--ink-2);font-family:var(--sans)}

/* ---- 影院列表 ---- */
.cinema-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;margin-top:20px}
.cinema-card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s}
.cinema-card:hover{transform:translateY(-3px)}
.cinema-card h3{font-family:var(--serif);font-size:18px;font-weight:800}
.cinema-card .addr{margin-top:6px;font-size:13px;color:var(--ink-2)}
.cinema-card .foot{margin-top:14px;display:flex;align-items:center;gap:10px}
.lamp{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.lamp.gray{background:#C9C2AE}
.lamp.red{background:var(--danger)}
.cinema-card .foot .cnt{margin-left:auto;font-size:12px;color:var(--ink-2)}

/* ---- 影院详情 ---- */
.backlink{margin-top:20px;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.backlink:hover{color:var(--brand-deep)}
.hall-poster-row{display:flex;gap:16px;overflow-x:auto;padding:8px 2px 18px}
.hall-poster{width:110px;flex:0 0 110px;cursor:pointer}
.hall-poster .img{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(160deg,#F3E7C8,#EAD9A8)}
.hall-poster .t{font-size:13px;font-weight:600;margin-top:6px;text-align:center;font-family:var(--serif)}
.hall-poster.on .img{box-shadow:0 0 0 3px var(--brand)}
.screening-list{margin-top:8px}
.screening-row{display:flex;align-items:center;gap:18px;background:var(--card);border-radius:12px;padding:16px 22px;margin-top:12px;box-shadow:var(--shadow)}
.screening-time{font-family:var(--din);font-size:22px;font-weight:700;width:74px}
.screening-time small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-2);font-weight:400}
.screening-hall{font-size:13px;color:var(--ink-2);width:90px}
.screening-price{font-family:var(--din);font-size:18px;color:var(--brand-deep);font-weight:700;width:90px}
.screening-price small{font-size:12px;color:var(--ink-2);font-family:var(--sans)}
.screening-btn{margin-left:auto;padding:8px 22px;border-radius:999px;background:var(--brand);color:#5c3d00;font-weight:700;font-size:14px}
.screening-btn:hover{background:var(--brand-deep);color:#fff}

/* ---- 登录页（独立全屏页，非首页嵌入） ---- */
.login-view{position:fixed;inset:0;background:linear-gradient(160deg,#FFF9ED 0%,#FFEEC7 100%);display:none;align-items:center;justify-content:center;z-index:80}
.login-view.active{display:flex}
.login-view .auth-card{width:420px;max-width:92vw;position:relative;background:#fff;border-radius:20px;padding:40px 36px;box-shadow:var(--shadow)}
.login-view .back-home{position:absolute;top:-40px;left:0;font-size:14px;color:var(--ink-2)}
.login-view .back-home:hover{color:var(--brand-deep)}
.login-view .brand-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.login-view .brand-row .dot{width:12px;height:12px;border-radius:3px;background:var(--brand);box-shadow:0 0 0 4px rgba(255,195,0,.25)}
.login-view .brand-name{font-family:var(--serif);font-size:22px;font-weight:800}
.login-view .auth-sub{text-align:center;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.auth-tabs{display:flex;gap:8px;background:var(--bg-deep);border-radius:999px;padding:5px;margin:26px 0 20px}
.auth-tabs button{flex:1;padding:9px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2)}
.auth-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.field input:focus{outline:none;border-color:var(--brand)}
.sms-row{display:flex;gap:10px}
.sms-row .btn{flex:0 0 auto;padding:9px 16px;font-size:13px}
.login-submit{margin-top:22px;padding:13px;border-radius:999px;background:var(--brand);color:#5c3d00;font-size:16px;font-weight:800;width:100%}
.login-submit:hover{background:var(--brand-deep);color:#fff}

/* ---- 选座弹窗 ---- */
.modal-mask{position:fixed;inset:0;background:rgba(20,15,0,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-mask.open{display:flex}
.seat-modal{background:#fff;border-radius:20px;width:660px;max-width:94vw;padding:28px 30px;box-shadow:var(--shadow);max-height:92vh;overflow:auto}
.seat-modal h3{font-family:var(--serif);font-size:20px;font-weight:800}
.seat-modal .sub{margin-top:4px;font-size:13px;color:var(--ink-2)}
.screen{height:26px;border-radius:8px;background:linear-gradient(180deg,#F2E2B0,#FFF9ED);margin:22px 40px 0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2)}
.seat-grid{display:flex;flex-direction:column;gap:8px;margin:18px auto 0;width:max-content}
.seat-row{display:flex;gap:8px;align-items:center}
.seat-row .ridx{width:14px;font-size:11px;color:var(--ink-2)}
.seat{width:30px;height:30px;border-radius:8px;background:var(--bg-deep);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-2);transition:.15s}
.seat.avail{cursor:pointer;background:#F7E8BE;color:#8a6d1f}
.seat.avail:hover{background:var(--brand)}
.seat.pick{background:var(--brand);color:#5c3d00;font-weight:700}
.seat.taken{background:#EDE7D8;color:#C9C2AE;cursor:not-allowed}
.seat.disable{background:repeating-linear-gradient(45deg,#F5EFE0,#F5EFE0 3px,#EDE5D0 3px,#EDE5D0 6px);color:#C9C2AE;cursor:not-allowed}
.legend{display:flex;gap:16px;justify-content:center;margin-top:16px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:4px;vertical-align:-2px}
.seat-foot{display:flex;align-items:center;gap:14px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.seat-foot .total{font-size:14px;color:var(--ink-2)}
.seat-foot .total b{font-family:var(--din);font-size:24px;color:var(--brand-deep)}
.seat-foot .btn{margin-left:auto;padding:11px 30px;font-size:15px}
.hint{text-align:center;font-size:13px;color:var(--ink-2);margin-top:10px}

/* ---- 确认订单 ---- */
.order-card{max-width:560px;margin:36px auto;background:#fff;border-radius:20px;padding:30px;box-shadow:var(--shadow)}
.order-card h1{font-family:var(--serif);font-size:24px;font-weight:800}
.order-line{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.order-line .k{color:var(--ink-2)}
.order-line .v{font-weight:600}
.order-seats{display:flex;gap:8px;flex-wrap:wrap}
.seat-chip{background:var(--brand);color:#5c3d00;border-radius:8px;padding:4px 12px;font-size:13px;font-weight:700}
.order-total{margin-top:18px;text-align:right;font-size:14px;color:var(--ink-2)}
.order-total b{font-family:var(--din);font-size:30px;color:var(--brand-deep)}
.order-total small{font-size:16px;color:var(--ink-2)}
.pay-bar{display:flex;gap:12px;margin-top:20px}
.pay-bar .btn{flex:1;padding:13px;font-size:15px}
.timer{font-family:var(--din);font-size:15px;color:var(--danger);font-weight:700}

/* ---- 我的订单 ---- */
.my-tabs{display:flex;gap:6px;margin-top:26px;border-bottom:1px solid var(--line)}
.my-tabs button{padding:12px 22px;font-size:15px;color:var(--ink-2);position:relative}
.my-tabs button.on{color:var(--ink);font-weight:700}
.my-tabs button.on:after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px;background:var(--brand)}
.order-item{display:flex;gap:18px;background:#fff;border-radius:14px;padding:18px 20px;margin-top:14px;box-shadow:var(--shadow);align-items:center}
.order-item .om{flex:0 0 86px;aspect-ratio:2/3;border-radius:10px;background:linear-gradient(160deg,#F3E7C8,#EAD9A8)}
.order-item .oi h4{font-family:var(--serif);font-size:16px;font-weight:800}
.order-item .oi p{font-size:13px;color:var(--ink-2);margin-top:4px}
.order-item .oi .code{font-family:var(--din);font-size:13px;color:var(--ink-2);margin-top:6px}
.order-item .or{margin-left:auto;text-align:right}
.order-item .or .st{font-size:13px;font-weight:700}
.order-item .or .st.pay{color:var(--brand-deep)}
.order-item .or .st.done{color:var(--ok)}
.order-item .or .st.cancel{color:var(--ink-2)}
.order-item .or .am{font-family:var(--din);font-size:20px;font-weight:700;margin-top:4px}
.order-item .or .ops{margin-top:8px;display:flex;gap:8px;justify-content:flex-end}
.order-item .or .ops .btn{font-size:12px;padding:5px 14px}
.mt-list{margin-top:26px}
.mt-row{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:20px 24px;box-shadow:var(--shadow)}
.mt-row .k{font-size:14px;color:var(--ink-2)}
.mt-row .v{font-size:15px;font-weight:700}

/* ---- toast ---- */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#2B2B2B;color:#FFF;padding:12px 24px;border-radius:12px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.15)}
#toast.show{opacity:1}
#toast.success{background:#2FA84F}
#toast.error{background:#E5484D}

/* ---- 空态 ---- */
.empty{padding:40px;text-align:center;color:var(--ink-2);font-size:13px}
.empty .e-btn{margin-top:14px;padding:8px 22px;border-radius:999px;background:var(--brand);color:#5c3d00;font-weight:700;font-size:13px}

@media(max-width:760px){
  .nav{display:none}
  .hero h1{font-size:28px}
  .movie-hero{grid-template-columns:1fr}
  .cinema-grid{grid-template-columns:1fr}
  .hero .ticket{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="logo" onclick="go('home')"><span class="dot"></span>CD-TICKET 电影票务</div>
    <nav class="nav">
      <a class="on" onclick="go('home')">首页</a>
      <a onclick="go('movies')">电影</a>
      <a onclick="go('cinemas')">影院</a>
    </nav>
    <div class="topbar-right">
      <div class="userchip" id="userchip" onclick="loginClick()">登录</div>
    </div>
  </div>
</div>

<!-- 首页 -->
<div class="page active" id="home">
  <div class="hero beam-wrap">
    <div class="beam"></div>
    <h1>今晚，和谁一起<br>看一场好电影？</h1>
    <p>热门大片、黄金场次、最佳座位，一站选齐。</p>
    <button class="cta" onclick="go('movies')">立即购票</button>
    <div class="ticket"><div class="movie">热映片单</div><div class="cut"></div><div class="price">¥45.0</div></div>
  </div>

  <h2 class="sec">热映电影 <button class="all" onclick="go('movies')">全部 ›</button></h2>
  <div class="poster-row" id="nowRow"></div>

  <h2 class="sec">待映电影 <button class="all" onclick="go('movies')">全部 ›</button></h2>
  <div class="poster-row" id="comingRow"></div>
</div>

<!-- 电影页 -->
<div class="page" id="movies">
  <h2 class="sec" style="margin-top:28px">全部影片</h2>
  <div class="poster-row" id="allRow"></div>
</div>

<!-- 电影详情 -->
<div class="page" id="detail">
  <a class="backlink" onclick="go('movies')">‹ 返回影片</a>
  <div class="movie-hero">
    <div class="movie-poster" id="dPoster"></div>
    <div class="movie-info">
      <h1 id="dTitle"></h1>
      <div class="movie-meta" id="dMeta"></div>
      <div class="movie-desc" id="dDesc"></div>
      <div class="movie-price" id="dPrice"></div>
      <button class="movie-buy" onclick="go('cinemas')">购票</button>
    </div>
  </div>
</div>

<!-- 影院页 -->
<div class="page" id="cinemas">
  <h2 class="sec" style="margin-top:28px">选择影院</h2>
  <div class="cinema-grid" id="cinemaGrid"></div>
</div>

<!-- 影院详情 -->
<div class="page" id="cinemaDetail">
  <a class="backlink" onclick="go('cinemas')">‹ 返回影院</a>
  <h2 class="sec" id="cdTitle" style="margin-top:12px"></h2>
  <div class="movie-desc" id="cdAddr" style="margin-top:-8px"></div>
  <h2 class="sec">正在排片</h2>
  <div class="hall-poster-row" id="hallMovies"></div>
  <h2 class="sec">今日场次</h2>
  <div class="screening-list" id="screeningList"></div>
</div>

<!-- 登录（独立全屏页） -->
<div class="login-view" id="loginView">
  <div class="auth-card">
    <a class="back-home" onclick="closeLogin()">‹ 返回首页</a>
    <div class="brand-row"><span class="dot"></span><span class="brand-name">CD-TICKET 电影票务</span></div>
    <div class="auth-sub">登录 / 注册 · 手机号验证码自动注册</div>
    <div class="auth-tabs">
      <button class="on" id="tabSms" onclick="authTab('sms')">验证码登录</button>
      <button id="tabPwd" onclick="authTab('pwd')">密码登录</button>
    </div>
    <div id="smsFields">
      <div class="field"><label>手机号</label><input id="phone" placeholder="请输入手机号"></div>
      <div class="field"><label>验证码</label>
        <div class="sms-row"><input id="code" placeholder="演示验证码 123456"><button class="btn btn-ghost" onclick="sendCode(this)">获取验证码</button></div>
      </div>
    </div>
    <div id="pwdFields" style="display:none">
      <div class="field"><label>手机号</label><input id="phonePwd" placeholder="请输入手机号"></div>
      <div class="field"><label>密码</label><input id="pwd" type="password" placeholder="请输入密码"></div>
    </div>
    <button class="login-submit" onclick="doLogin()">登录</button>
    <div class="hint">验证码登录自动注册 · 登录后可设置密码</div>
  </div>
</div>

<!-- 确认订单 -->
<div class="page" id="orderConfirm">
  <div class="order-card">
    <h1>确认订单</h1>
    <div class="order-line"><span class="k">电影</span><span class="v" id="ocMovie">—</span></div>
    <div class="order-line"><span class="k">影院</span><span class="v" id="ocCinema">—</span></div>
    <div class="order-line"><span class="k">场次</span><span class="v" id="ocTime">—</span></div>
    <div class="order-line"><span class="k">座位</span><span class="v order-seats" id="ocSeats"></span></div>
    <div class="order-total">共 <b id="ocTotal">0</b> 元</div>
    <div class="pay-bar">
      <button class="btn btn-ghost" onclick="deferPay()">稍后支付</button>
      <button class="btn btn-primary" onclick="pay()">立即支付</button>
    </div>
    <div class="hint">待支付订单 <span class="timer" id="ocTimer">15:00</span> 后自动取消</div>
  </div>
</div>

<!-- 我的 -->
<div class="page" id="my">
  <h2 class="sec" style="margin-top:28px">我的订单</h2>
  <div class="my-tabs">
    <button class="on" data-s="0" onclick="myTab(this)">待支付</button>
    <button data-s="1" onclick="myTab(this)">已支付</button>
    <button data-s="2" onclick="myTab(this)">已取消</button>
  </div>
  <div id="orderList"></div>
  <h2 class="sec">账号</h2>
  <div class="mt-list" id="accRows"></div>
  <div style="margin-top:18px"><button class="btn btn-ghost" style="width:100%;padding:12px;border-radius:12px;font-size:14px" onclick="logout()">退出登录</button></div>
</div>

<!-- 选座弹窗 -->
<div class="modal-mask" id="seatModal" onclick="if(event.target===this)closeSeat()">
  <div class="seat-modal">
    <h3>选择座位 <span id="smMovie" style="color:var(--ink-2);font-family:var(--sans);font-weight:400;font-size:13px"></span></h3>
    <div class="sub" id="smMeta"></div>
    <div class="screen">银 幕</div>
    <div class="seat-grid" id="seatGrid"></div>
    <div class="legend">
      <span><i style="background:#F7E8BE"></i>可选</span>
      <span><i style="background:var(--brand)"></i>已选</span>
      <span><i style="background:#EDE7D8"></i>已售</span>
      <span><i style="background:repeating-linear-gradient(45deg,#F5EFE0,#F5EFE0 3px,#EDE5D0 3px,#EDE5D0 6px)"></i>不可售</span>
    </div>
    <div class="seat-foot">
      <span class="total">已选 <b id="pickCount">0</b> 座 · 合计 <b id="pickTotal">0</b> 元</span>
      <button class="btn btn-primary" onclick="confirmSeat()">确认选座</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ---- 数据 ---- */
const MOVIES=[
  {id:1,title:'流浪地球 3',status:'now',price:48,date:'2026-05-01',score:9.2,desc:'太阳危机后的第 37 年，地球踏上了新的航程。行星发动机全功率重启，人类文明再一次站在了抉择的十字路口。',meta:'科幻 · 冒险 · 173分钟'},
  {id:2,title:'深海传说',status:'now',price:42,date:'2026-04-18',score:8.7,desc:'一位少女误入深海，在光影交错的鲸落之城，寻找消失的家人。',meta:'动画 · 奇幻 · 112分钟'},
  {id:3,title:'长安三万里·续',status:'now',price:45,date:'2026-03-28',score:8.9,desc:'盛唐的月光下，诗人与将军的友谊跨越万里山河。',meta:'历史 · 剧情 · 168分钟'},
  {id:4,title:'机器人之梦',status:'now',price:39,date:'2026-04-02',score:8.5,desc:'未来都市里，一个孤独的人和一个有梦的机器人。',meta:'科幻 · 温情 · 102分钟'},
  {id:5,title:'千里江山图',status:'coming',price:52,date:'2026-09-30',score:0,desc:'一卷青绿，千里江山。北宋少年画师的传奇一生即将上映。',meta:'历史 · 传记 · 148分钟'},
  {id:6,title:'星际拓荒者',status:'coming',price:49,date:'2026-10-12',score:0,desc:'人类第一批深空拓荒者，在比邻星系开启新家园。',meta:'科幻 · 动作 · 135分钟'},
  {id:7,title:'火锅英雄传',status:'coming',price:41,date:'2026-11-06',score:0,desc:'山城重庆，一家老火锅店里藏着一个秘密。',meta:'喜剧 · 犯罪 · 116分钟'}
];
const CINEMAS=[
  {id:1,name:'CD-TICKET·天府广场店',addr:'成都市锦江区人民东路10号',open:true,busy:false},
  {id:2,name:'CD-TICKET·SKP店',addr:'四川省成都市高新区天府大道中段1388号',open:true,busy:true},
  {id:3,name:'CD-TICKET·宽窄巷子店',addr:'成都市青羊区长顺上街127号',open:false,busy:false}
];
const SESS=[
  {cinema:1,movie:1,hall:'3号激光厅',time:'14:20',price:48},
  {cinema:1,movie:1,hall:'1号巨幕厅',time:'19:30',price:58},
  {cinema:1,movie:2,hall:'2号厅',time:'16:40',price:42},
  {cinema:1,movie:3,hall:'5号厅',time:'20:00',price:45},
  {cinema:2,movie:1,hall:'IMAX厅',time:'21:10',price:68},
  {cinema:2,movie:2,hall:'4号厅',time:'15:30',price:42},
  {cinema:3,movie:1,hall:'1号厅',time:'18:00',price:40}
];
/* 座位占位：row*10+col */
const TAKEN=[22,23,24,25,41,42,51,52,53,71,72];
const DISABLE=[61,62,63,64,81,82];
const ROWS=8,COLS=10;
const PICKED=new Set();
let curMovie=1,curCinema=1,curSession=null;
let pendingOrder=null,loginRedirect='';
const loggedIn={state:false,phone:'',nick:'',hasPwd:false};

/* ---- 渲染 ---- */
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let toastT;
function toast(msg,type){
  const t=$('#toast');t.textContent=msg;t.className='show '+(type||'');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1600);
}

function posterCard(m){
  return `<div class="poster" onclick="openDetail(${m.id})">
    <div class="img"><span class="tag ${m.status==='coming'?'coming':''}">${m.status==='now'?'热映':'待映'}</span></div>
    <div class="t">${esc(m.title)}</div>
    <div class="d">${m.status==='now'?'评分 '+m.score:'上映 '+m.date}</div>
    <div class="p">¥${m.price}<small> 起</small></div>
  </div>`;
}
function renderHome(){
  $('#nowRow').innerHTML=MOVIES.filter(m=>m.status==='now').map(posterCard).join('');
  $('#comingRow').innerHTML=MOVIES.filter(m=>m.status==='coming').map(posterCard).join('');
}
function renderMovies(){
  $('#allRow').innerHTML=MOVIES.map(posterCard).join('');
}
function openDetail(id){
  curMovie=id;const m=MOVIES.find(x=>x.id===id);
  $('#dTitle').textContent=m.title;
  $('#dMeta').textContent=m.meta;
  $('#dDesc').textContent=m.desc;
  $('#dPrice').innerHTML=`¥${m.price} <small>起 · 会员再减 5 元</small>`;
  $('#dPoster').style.background=`linear-gradient(160deg,#${hashColor(m.title)},#EAD9A8)`;
  go('detail');
}
function hashColor(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%0xffffff;return h.toString(16).padStart(6,'0').slice(0,6);}

function renderCinemas(){
  $('#cinemaGrid').innerHTML=CINEMAS.map(c=>`
    <div class="cinema-card" onclick="openCinema(${c.id})">
      <h3>${esc(c.name)}</h3>
      <div class="addr">${esc(c.addr)}</div>
      <div class="foot"><span class="lamp ${c.open?'':'gray'}"></span><span>${c.open?'营业中':'今日停业'}</span><span class="cnt">${SESS.filter(s=>s.cinema===c.id).length} 场排片</span></div>
    </div>`).join('');
}
function openCinema(id){
  curCinema=id;const c=CINEMAS.find(x=>x.id===id);
  $('#cdTitle').textContent=c.name;
  $('#cdAddr').textContent=c.addr;
  renderHallMovies();
  go('cinemaDetail');
}
function renderHallMovies(){
  const mids=[...new Set(SESS.filter(s=>s.cinema===curCinema).map(s=>s.movie))];
  $('#hallMovies').innerHTML=mids.map(m=>{
    const mv=MOVIES.find(x=>x.id===m);
    return `<div class="hall-poster ${m===curMovie?'on':''}" onclick="pickMovie(${m})">
      <div class="img"></div><div class="t">${esc(mv.title)}</div></div>`;
  }).join('');
  renderSessions();
}
function pickMovie(m){curMovie=m;renderHallMovies();}
function renderSessions(){
  const list=SESS.filter(s=>s.cinema===curCinema&&s.movie===curMovie);
  $('#screeningList').innerHTML=list.length?list.map(s=>`
    <div class="screening-row">
      <div class="screening-time">${s.time}<small>${s.hall.split('厅')[0]}号厅</small></div>
      <div class="screening-hall">${esc(s.hall)}</div>
      <div class="screening-price">¥${s.price}<small> 起</small></div>
      <button class="screening-btn" onclick="buyTicket(${s.time.replace(':','')})">选座购票</button>
    </div>`).join('')
    :'<div class="hint" style="padding:30px">该影片今日暂无场次</div>';
}

function buyTicket(tt){
  curSession=SESS.find(s=>s.cinema===curCinema&&s.movie===curMovie&&s.time.replace(':','')==tt);
  if(!loggedIn.state){loginRedirect=`cinemaDetail|${curCinema}|${curMovie}`;openLogin();return;}
  openSeat();
}
function openSeat(){
  const s=curSession,m=MOVIES.find(x=>x.id===curMovie),c=CINEMAS.find(x=>x.id===curCinema);
  $('#smMovie').textContent=`· ${m.title}`;
  $('#smMeta').textContent=`${c.name} · ${s.hall} · ${s.time}`;
  PICKED.clear();
  renderSeats();
  $('#seatModal').classList.add('open');
}
function renderSeats(){
  let html='';
  for(let r=1;r<=ROWS;r++){
    html+=`<div class="seat-row"><span class="ridx">${r}</span>`;
    for(let col=1;col<=COLS;col++){
      const idx=r*10+col;
      const taken=TAKEN.includes(idx),disable=DISABLE.includes(idx),pick=PICKED.has(idx);
      const cls=pick?'pick':taken?'taken':disable?'disable':'avail';
      html+=`<div class="seat ${cls}" data-i="${idx}" ${cls==='avail'?'onclick="toggleSeat('+idx+')"':''}>${col}</div>`;
    }
    html+='</div>';
  }
  $('#seatGrid').innerHTML=html;
  updatePick();
}
function toggleSeat(idx){
  PICKED.has(idx)?PICKED.delete(idx):PICKED.add(idx);
  renderSeats();
}
function updatePick(){
  const unit=curSession?curSession.price:MOVIES.find(x=>x.id===curMovie).price;
  $('#pickCount').textContent=PICKED.size;
  $('#pickTotal').textContent=PICKED.size*unit;
}
function confirmSeat(){
  if(!PICKED.size){toast('请先选择座位','error');return;}
  const s=curSession,m=MOVIES.find(x=>x.id===curMovie),c=CINEMAS.find(x=>x.id===curCinema);
  $('#ocMovie').textContent=m.title;
  $('#ocCinema').textContent=c.name;
  $('#ocTime').textContent=`${s.hall} · ${s.time}`;
  const seats=[...PICKED].sort().map(i=>`${Math.floor(i/10)}排${i%10}座`);
  $('#ocSeats').innerHTML=seats.map(x=>`<span class="seat-chip">${x}</span>`).join('');
  $('#ocTotal').textContent=seats.length*s.price;
  startTimer(15*60);
  pendingOrder={movie:m.id,seats:[...PICKED],amount:seats.length*s.price};
  $('#seatModal').classList.remove('open');
  go('orderConfirm');
}
function pay(){
  pendingOrder=null;
  toast('支付成功，座位已锁定','success');
  go('my');myTab($('.my-tabs button[data-s="1"]'));
}
function deferPay(){
  toast('已保存，可在「我的订单」继续支付','success');
  go('my');myTab($('.my-tabs button[data-s="0"]'));
}
let timerInt;
function startTimer(sec){
  clearInterval(timerInt);
  const el=$('#ocTimer');
  const tick=()=>{el.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(sec>0)sec--;else clearInterval(timerInt);};
  tick();timerInt=setInterval(tick,1000);
}

function authTab(mode){
  $('#tabSms').classList.toggle('on',mode==='sms');
  $('#tabPwd').classList.toggle('on',mode==='pwd');
  $('#smsFields').style.display=mode==='sms'?'':'none';
  $('#pwdFields').style.display=mode==='pwd'?'':'none';
}
function sendCode(btn){
  btn.textContent='已发送';
  btn.disabled=true;
  let n=60;
  const iv=setInterval(()=>{btn.textContent=`${--n}s`;if(n<=0){clearInterval(iv);btn.textContent='重新获取';btn.disabled=false;}},1000);
}
function doLogin(){
  const p=$('#phone').value||$('#phonePwd').value;
  if(!p){toast('请输入手机号','error');return;}
  loggedIn.state=true;loggedIn.phone=p;loggedIn.nick='用户'+p.slice(-4);
  renderUserChip();
  toast('登录成功','success');
  closeLogin();
  if(loginRedirect){const back=loginRedirect;loginRedirect='';resumeFromLogin(back);return;}
  go('home');
}
function resumeFromLogin(back){
  const [page,cinema,movie]=back.split('|');
  if(page==='cinemaDetail'&&cinema){curCinema=+cinema;curMovie=+movie;openCinema(curCinema);return;}
  go(page||'home');
}
function openLogin(){loginRedirect='';$('#loginView').classList.add('active');}
function closeLogin(){$('#loginView').classList.remove('active');}
function loginClick(){
  if(loggedIn.state){go('my');return;}
  openLogin();
}
function logout(){
  loggedIn.state=false;loggedIn.phone='';loggedIn.nick='';loggedIn.hasPwd=false;
  pendingOrder=null;loginRedirect='';
  renderUserChip();
  toast('已退出登录');
  go('home');
}
function renderUserChip(){
  if(!loggedIn.state){
    $('#userchip').innerHTML=`<span class="btn btn-primary" style="padding:7px 20px">登录</span>`;
    $('#userchip').onclick=loginClick;
    return;
  }
  $('#userchip').innerHTML=`<span class="avatar">${loggedIn.nick.slice(-1)}</span><span>${loggedIn.nick}</span>`;
  $('#userchip').onclick=()=>go('my');
}
function myTab(btn){
  $('.my-tabs button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderOrders(+btn.dataset.s);
}
function renderOrders(s){
  if(s===undefined)s=0;
  let list=[];
  if(s===0){
    if(pendingOrder){const m=MOVIES.find(x=>x.id===pendingOrder.movie);list.push({st:0,m:m?m.title:'未知影片',sess:curSession?`${curSession.hall} · ${curSession.time}`:'—',am:pendingOrder.amount,seats:pendingOrder.seats,code:''});}
    list.push(
      {st:0,m:'深海传说',sess:'2号厅 · 16:40',am:84,seats:['5排8座'],code:''},
      {st:0,m:'长安三万里·续',sess:'5号厅 · 20:00',am:90,seats:['7排3座','7排4座'],code:''}
    );
  }
  if(s===1){
    list=[
      {st:1,m:'流浪地球 3',sess:'3号激光厅 · 14:20',am:96,seats:['3排5座','3排6座'],code:'取票码 4826 1937'},
      {st:1,m:'机器人之梦',sess:'1号厅 · 18:00',am:78,seats:['4排2座'],code:'取票码 3941 2058'},
      {st:1,m:'星际拓荒者',sess:'IMAX厅 · 21:10',am:68,seats:['2排7座'],code:'取票码 7710 8834'}
    ];
  }
  if(s===2){
    list=[
      {st:2,m:'火锅英雄传',sess:'4号厅 · 15:30',am:82,seats:[],code:'超时未支付，座位已释放'},
      {st:2,m:'深海传说',sess:'2号厅 · 16:40',am:42,seats:[],code:'手动取消'}
    ];
  }
  $('#orderList').innerHTML=list.length?list.map(o=>`
    <div class="order-item">
      <div class="om"></div>
      <div class="oi"><h4>${esc(o.m)}</h4><p>${esc(o.sess)}</p>${o.code?`<div class="code" style="${o.st===2?'color:var(--ink-2)':''}">${o.code}</div>`:''}${o.seats&&o.seats.length?`<div class="code" style="color:var(--brand-deep)">${o.seats.map(x=>x).join(' · ')}</div>`:''}</div>
      <div class="or">
        <div class="st ${['pay','done','cancel'][o.st]}">${['待支付','已支付','已取消'][o.st]}</div>
        <div class="am">¥${o.am}</div>
        <div class="ops">${o.st===0?`<button class="btn btn-ghost" onclick="cancelOrder(this)">取消订单</button><button class="btn btn-primary" onclick="pay()">去支付</button>`:''}</div>
      </div>
    </div>`).join('')
    :'<div class="empty">该分类暂无订单<button class="e-btn" onclick="go(\'cinemas\')">去购票</button></div>';
  $('#accRows').innerHTML=`
    <div class="mt-row"><span class="k">手机号</span><span class="v">${loggedIn.phone||'138****0000'}</span></div>
    <div class="mt-row"><span class="k">登录密码</span><span class="v">${loggedIn.hasPwd?'已设置':'未设置'}</span></div>
    <div class="mt-row"><span class="k">操作</span><span class="v"><button class="btn btn-primary" style="font-size:13px;padding:6px 16px" onclick="setPwd()">${loggedIn.hasPwd?'修改密码':'设置密码'}</button></span></div>`;
}
function cancelOrder(btn){btn.closest('.order-item').remove();toast('订单已取消，座位已释放','success');}
function setPwd(){loggedIn.hasPwd=true;toast('密码设置成功（演示）','success');renderOrders(0);}

function go(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el=$('#'+name);
  el.classList.add('active');
  window.scrollTo(0,0);
  const navmap={home:0,movies:1,cinemas:2};
  document.querySelectorAll('.nav a').forEach((a,i)=>a.classList.toggle('on',navmap[name]===i));
  if(name==='my')renderOrders(+($('.my-tabs button.on')?.dataset?.s??0));
}
function closeSeat(){$('#seatModal').classList.remove('open');}

/* init */
renderUserChip();
renderHome();
renderMovies();
renderCinemas();
/* 影院详情默认选中第一部有排片的电影，避免空场次 */
curMovie=SESS.find(s=>s.cinema===curCinema)?.movie||1;
</script>
</body>
</html>
