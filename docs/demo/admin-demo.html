<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CD-TICKET 电影票务系统 · 管理端演示</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;800&family=DIN+Alternate:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#141414;--bg2:#1E1E1E;--bg3:#272727;
  --brand:#FFC300;--brand-deep:#F5A623;
  --ink:#F5F2E8;--ink-2:#9A927F;--line:#333;
  --ok:#2FA84F;--danger:#E5484D;
  --sans:'Noto Sans SC',system-ui,sans-serif;--serif:'Noto Serif SC',serif;--din:'DIN Alternate',sans-serif;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none;cursor:pointer}
input,select{font-family:inherit}
.view{display:none}
.view.active{display:block}

/* ---- 登录 ---- */
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1000px 600px at 70% -10%,#3A3200 0%,#141414 60%)}
.login-card{width:460px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:44px 40px 36px}
.login-card .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:24px;font-weight:800;justify-content:center;margin-bottom:34px}
.login-card .brand .dot{width:14px;height:14px;border-radius:4px;background:var(--brand);box-shadow:0 0 18px rgba(255,195,0,.6)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand)}
.login-btn{width:100%;padding:13px;border-radius:10px;background:var(--brand);color:#5c3d00;font-size:15px;font-weight:800;margin-top:6px}
.login-btn:hover{background:var(--brand-deep);color:#fff}
.tear{position:relative;border-top:2px dashed var(--line);margin:28px -40px -16px}
.tear::before,.tear::after{content:'';position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.tear::before{left:-11px}
.tear::after{right:-11px}

/* ---- 后台布局 ---- */
.layout{display:flex;min-height:100vh}
.sidebar{width:232px;flex:0 0 232px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side-brand{display:flex;align-items:center;gap:10px;padding:20px 22px;font-family:var(--serif);font-size:18px;font-weight:800;border-bottom:1px solid var(--line)}
.side-brand .dot{width:12px;height:12px;border-radius:3px;background:var(--brand)}
.side-brand small{display:block;font-family:var(--sans);font-size:10px;color:var(--ink-2);font-weight:400}
.menu{padding:14px 12px;flex:1;overflow-y:auto}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;font-size:14px;color:var(--ink-2);cursor:pointer;margin-bottom:2px}
.menu-item .ic{font-size:16px;width:20px;text-align:center}
.menu-item:hover{background:var(--bg3);color:var(--ink)}
.menu-item.on{background:rgba(255,195,0,.12);color:var(--brand);font-weight:700}
.status-lamps{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--line)}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(47,168,79,.5)}
.lamp.busy{background:var(--brand);box-shadow:0 0 6px rgba(255,195,0,.6)}
.lamp.off{background:#555}
.lamp-wrap{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:10px;color:var(--ink-2)}
.lamp-wrap.on{color:var(--ink)}
.lamp-wrap.on .lamp{transform:scale(1.25)}
.side-foot{border-top:1px solid var(--line);padding:16px 22px}
.side-foot .cinema-name{font-family:var(--serif);font-size:13px;font-weight:700}
.side-foot .cinema-sub{font-size:11px;color:var(--ink-2);margin-top:2px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;display:flex;align-items:center;gap:20px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--bg2)}
.topbar .crumb{font-size:14px;color:var(--ink-2)}
.topbar .crumb b{color:var(--ink)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.admin-chip{display:flex;align-items:center;gap:10px;font-size:13px}
.admin-chip .avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#5c3d00;display:flex;align-items:center;justify-content:center;font-weight:800}
.logout-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.logout-btn:hover{color:var(--danger);border-color:var(--danger)}
.content{padding:26px 28px}

/* ---- 仪表盘 ---- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stat-card .label{font-size:12px;color:var(--ink-2)}
.stat-card .num{font-family:var(--din);font-size:30px;font-weight:700;margin-top:8px}
.stat-card .num small{font-size:14px;color:var(--ink-2);font-weight:400}
.stat-card .delta{font-size:12px;margin-top:6px;color:var(--ok)}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.chart{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.chart h3{font-size:14px;font-weight:700;margin-bottom:12px}
.chart .box{height:240px}

/* ---- 列表页 ---- */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius)}
.panel-head{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h3{font-size:15px;font-weight:700}
.panel-head .search{margin-left:auto;display:flex;gap:8px}
.search input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand)}
.search .btn{padding:8px 16px;border-radius:8px;background:var(--brand);color:#5c3d00;font-size:13px;font-weight:700}
.search .btn:hover{background:var(--brand-deep);color:#fff}
.panel-head .add{padding:9px 18px;border-radius:9px;background:var(--brand);color:#5c3d00;font-size:13px;font-weight:800}
.panel-head .add:hover{background:var(--brand-deep);color:#fff}
.filters{display:flex;gap:8px;padding:12px 20px 0}
.filters .f-btn{font-size:12px;padding:6px 14px;border-radius:999px;color:var(--ink-2);border:1px solid var(--line)}
.filters .f-btn.on{background:var(--brand);color:#5c3d00;font-weight:700;border-color:var(--brand)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--ink-2);text-align:left;padding:12px 20px;font-weight:500;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 20px;font-size:13px;border-bottom:1px solid #2A2A2A}
tr:last-child td{border-bottom:none}
td .poster{width:32px;height:46px;border-radius:6px;background:linear-gradient(160deg,#3A3A3A,#2A2A2A);display:inline-block;vertical-align:middle;margin-right:8px}
.tag-pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:6px;white-space:nowrap}
.tag-pill.yellow{background:rgba(255,195,0,.14);color:var(--brand)}
.tag-pill.green{background:rgba(47,168,79,.14);color:var(--ok)}
.tag-pill.gray{background:rgba(255,255,255,.08);color:var(--ink-2)}
.tag-pill.red{background:rgba(229,72,77,.14);color:var(--danger)}
.row-ops button{font-size:12px;color:var(--ink-2);margin-right:12px}
.row-ops button:hover{color:var(--brand)}
.row-ops button.danger:hover{color:var(--danger)}
.seat-chips span{display:inline-block;background:rgba(255,195,0,.14);color:var(--brand);border-radius:6px;padding:2px 8px;font-size:11px;margin:2px}
.pager{display:flex;align-items:center;gap:12px;justify-content:flex-end;padding:14px 20px}
.pager button{padding:6px 14px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager button:hover:not(:disabled){color:var(--brand)}
.pager .info{font-size:12px;color:var(--ink-2)}
.empty{padding:48px;text-align:center;color:var(--ink-2);font-size:13px}

/* ---- 弹窗 ---- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.mask.open{display:flex}
.modal{width:480px;max-width:94vw;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:28px;max-height:92vh;overflow:auto}
.modal h3{font-size:17px;font-weight:700;margin-bottom:20px}
.modal .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .field.full{grid-column:1/-1}
.modal .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.modal .btn{padding:9px 20px;border-radius:9px;font-size:13px;font-weight:700}
.modal .btn-cancel{background:var(--bg3);color:var(--ink-2)}
.modal .btn-ok{background:var(--brand);color:#5c3d00}
.modal .btn-ok:hover{background:var(--brand-deep);color:#fff}
/* 订单详情 */
.order-detail .od-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2A2A2A;font-size:13px}
.order-detail .od-row .k{color:var(--ink-2)}
.order-detail .od-row .v{font-weight:600}
.order-detail .od-am{text-align:right;font-family:var(--din);font-size:24px;color:var(--brand);margin-top:14px}
.order-detail .od-am small{font-size:13px;color:var(--ink-2);font-family:var(--sans)}

/* ---- 座位编辑器 ---- */
.seat-editor{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.seat-editor .hall-list{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.seat-editor .hall-row{display:flex;justify-content:space-between;padding:12px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.seat-editor .hall-row:hover{background:var(--bg3)}
.seat-editor .hall-row.on{background:rgba(255,195,0,.1);color:var(--brand)}
.seat-editor .hall-add{margin-top:12px;width:100%;padding:9px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--ink-2)}
.seat-editor .hall-add:hover{color:var(--brand);border-color:var(--brand)}
.seat-editor .canvas{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-align:center}
.seat-canvas{display:inline-grid;gap:6px}
.seat-canvas .cseat{width:26px;height:26px;border-radius:6px;background:#3A3A3A;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:#777}
.seat-canvas .cseat:hover{background:#555}
.seat-canvas .cseat.sold{background:var(--brand);color:#5c3d00}
.seat-canvas .cseat.sold:hover{background:var(--brand-deep)}
.canvas .save-seat{margin-top:16px;padding:10px 28px;border-radius:9px;background:var(--brand);color:#5c3d00;font-size:13px;font-weight:800}
.canvas .save-seat:hover{background:var(--brand-deep);color:#fff}
.canvas .canvas-hint{margin-top:10px;font-size:11px;color:var(--ink-2)}
.canvas .mini-screen{height:16px;background:linear-gradient(180deg,#3A3A3A,#222);border-radius:6px;margin-bottom:14px;font-size:10px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}

/* ---- toast ---- */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);color:var(--ink);padding:12px 22px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#toast.success{border-color:var(--ok)}#toast.error{border-color:var(--danger)}

@media(max-width:900px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr}
  .sidebar{width:70px;flex-basis:70px}
  .sidebar .menu-item span:not(.ic){display:none}
  .side-brand{font-size:0}
  .seat-editor{grid-template-columns:1fr}
  .panel-head .search{margin-left:0}
}
</style>
</head>
<body>

<!-- 登录 -->
<div class="view active" id="login">
  <div class="login">
    <div class="login-card">
      <div class="brand">电影票务系统<span class="dot"></span>管理后台</div>
      <div class="field"><label>用户名</label><input id="uname" placeholder="用户名"></div>
      <div class="field"><label>密码</label><input id="upass" type="password" placeholder="密码"></div>
      <button class="login-btn" onclick="doLogin()">登 录</button>
      <div class="tear"></div>
    </div>
  </div>
</div>

<!-- 后台 -->
<div class="view" id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="side-brand"><span class="dot"></span>CD-TICKET<small id="sideRole">管理后台</small></div>
      <nav class="menu" id="menu"></nav>
      <div class="status-lamps" id="lamps" title="多影院实时状态（多影院隔离的视觉隐喻）"></div>
      <div class="side-foot">
        <div class="cinema-name" id="sideCinema">—</div>
        <div class="cinema-sub" id="sideSub">—</div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="crumb" id="crumb">仪表盘</div>
        <div class="topbar-right">
          <div class="admin-chip"><span class="avatar" id="chipAvatar">A</span><span id="chipName">admin</span></div>
          <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
      </div>
      <div class="content">
        <div class="screen" id="scr-dash">
          <div class="stat-grid" id="stats"></div>
          <div class="chart-grid">
            <div class="chart"><h3>近 7 日票房趋势</h3><div class="box" id="chartTrend"></div></div>
            <div class="chart"><h3>热映影片票房 Top</h3><div class="box" id="chartTop"></div></div>
          </div>
        </div>
        <div class="screen" id="scr-list" style="display:none">
          <div class="panel">
            <div class="panel-head">
              <h3 id="listTitle">—</h3>
              <div class="search" id="listSearch">
                <input id="searchInput" placeholder="搜索…"><button class="btn" onclick="renderList()">搜索</button>
              </div>
              <button class="add" id="listAdd" onclick="openModal()">＋ 新增</button>
            </div>
            <div class="filters" id="listFilters"></div>
            <table>
              <thead id="listHead"></thead>
              <tbody id="listBody"></tbody>
            </table>
            <div class="pager" id="pager"></div>
          </div>
        </div>
        <div class="screen" id="scr-seat" style="display:none">
          <div class="seat-editor">
            <div class="hall-list">
              <h3 style="font-size:14px;margin-bottom:12px">影厅列表</h3>
              <div id="hallList"></div>
              <button class="hall-add" onclick="openHallModal()">＋ 新增影厅</button>
            </div>
            <div class="canvas">
              <h3 style="font-size:14px;margin-bottom:12px" id="seatCanvasTitle">座位模板</h3>
              <div class="mini-screen">银 幕</div>
              <div class="seat-canvas" id="seatCanvas"></div>
              <button class="save-seat" onclick="saveSeats()">保存座位模板</button>
              <div class="canvas-hint">点击座位切换「可售 / 不可售」，保存后仅当前影厅生效</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="mask" id="modal">
  <div class="modal">
    <h3 id="modalTitle">新增</h3>
    <div class="form-grid" id="modalForm"></div>
    <div class="modal-foot">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-ok" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>
<div class="mask" id="odModal">
  <div class="modal">
    <h3>订单详情</h3>
    <div class="order-detail" id="odBody"></div>
    <div class="modal-foot"><button class="btn btn-cancel" onclick="$('#odModal').classList.remove('open')">关闭</button></div>
  </div>
</div>
<div id="toast"></div>

  const t=$('#toast');t.textContent=msg;t.className=type||'';

function openModal(){

function fillModal(item){
  const f=FORMS[modalCtx.key];
  $('#modalForm').querySelectorAll('[data-k]').forEach(el=>{
    let v=item[el.dataset.k];
    if(v!==undefined&&el.dataset.k!=='password'){
      if(el.tagName==='SELECT'){const conf=f.find(x=>x.key===el.dataset.k);if(conf&&conf.map)el.value=Object.keys(conf.map).find(k=>conf.map[k]===v)||v;else el.value=v;}
      else el.value=v;

  });

function saveModal(){
  const f=FORMS[modalCtx.key];

    const el=$(`#modalForm [data-k="${x.key}"]`);

    if(x.key==='price')v=+v;
    data[x.key]=v;
  });
  if(modalCtx.key==='movies')MOVIES.push({id:MOVIES.length+1,title:data.title,status:data.status,date:data.date,price:data.price,box:0});
  if(modalCtx.key==='cinemas')CINEMAS.push({id:CINEMAS.length+1,name:data.name,addr:data.addr,status:data.status,busy:false});
  if(modalCtx.key==='admins')ADMINS.push({username:data.username,role:data.role==='超管'||data.role==='超级管理员'?'超管':data.role==='影院管理员'?'影院管理员':'超管',cinema:data.cinema,status:data.status||'on'});
  if(modalCtx.key==='banners')BANNERS.push({id:BANNERS.length+1,title:data.title,link:data.link,sort:+data.sort,status:data.status});
  if(modalCtx.key==='sessions')SESSIONS.push({movie:data.movie,hall:data.hall,cinema:'天府广场店',time:data.time,price:+data.price,status:data.status});

  closeModal();renderList();toast('保存成功','success');
}

      <span>${h.name}</span><span style="color:var(--ink-2)">${h.rows}×${h.cols}</span>
    </div>`).join('');
  renderCanvas();
}
function pickHall(id){selHall=id;renderHalls();}
function openHallModal(){listKey='halls';openModal();}
function renderCanvas(){
  const h=HALLS.find(x=>x.id===selHall);
  $('#seatCanvasTitle').textContent=`${h.name} 座位模板`;
  $('#seatCanvas').style.gridTemplateColumns=`repeat(${h.cols},26px)`;
  let html='';
  for(let r=1;r<=h.rows;r++){
    for(let c=1;c<=h.cols;c++){
      const idx=(r-1)*h.cols+c;
      const sold=h.seats.has(idx);
      html+=`<div class="cseat ${sold?'sold':''}" onclick="toggleSeatCfg(${idx})">${c}</div>`;
    }
  }
  $('#seatCanvas').innerHTML=html;
}
function toggleSeatCfg(idx){
  const h=HALLS.find(x=>x.id===selHall);
  h.seats.has(idx)?h.seats.delete(idx):h.seats.add(idx);
  renderCanvas();
}
function saveSeats(){const h=HALLS.find(x=>x.id===selHall);toast(`「${h.name}」座位模板已保存（${h.seats.size} 座不可售）`,'success');}

/* 初始化 */
</script>
</body>
</html>
